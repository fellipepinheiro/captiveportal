# ─── HTTP  (redirect para HTTPS + desafio Let's Encrypt) ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name guests.bntc.com.br;
    server_tokens off;

    # Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ─── HTTPS (produção) ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guests.bntc.com.br;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/guests.bntc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guests.bntc.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10M;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # Redireciona raiz para a rota do portal captive
    location = / {
        return 302 /guest/s/default/;
    }

    location / {
        proxy_pass         http://web:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ─── MODO HTTP (dev / homologacao / sem certificado SSL) ────────────────────
# Proxy direto HTTP -> Flask. Funciona sem dominio e sem certificado.
# Para producao com SSL, comente o bloco "HTTP" e descomente o bloco "HTTPS".

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Challenge Let's Encrypt (necessario mesmo no modo HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Upload de arquivos: aumenta limite e timeout
    client_max_body_size 10M;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    location / {
        proxy_pass         http://web:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}



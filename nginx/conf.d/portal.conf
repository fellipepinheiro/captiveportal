# ─── HTTP: redireciona tudo para HTTPS, exceto o challenge ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name portal.seudominio.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


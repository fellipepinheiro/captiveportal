{% extends 'base.html' %}
{% block title %}Cadastro &mdash; Portal WiFi{% endblock %}

{% block content %}
<div class="w-full max-w-md fade-in">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary mb-4">
      <svg aria-label="Pessoa" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" class="w-8 h-8">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Primeiro acesso</h1>
    <p class="text-sm text-gray-500 mt-1">Voc&ecirc; ainda n&atilde;o est&aacute; cadastrado.</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <p class="text-sm text-gray-600 mb-5">
      Preencha seus dados para se cadastrar e liberar o acesso.
    </p>

    <form method="POST" action="/guest/cadastro" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <div class="w-full rounded-xl border border-gray-100 bg-gray-100 px-4 py-3 text-sm text-gray-500">
            {{ email }}
          </div>
        </div>

        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
          <input
            type="text" id="name" name="name" required autocomplete="name"
            placeholder="Seu nome completo"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-gray-50 transition-colors"
          >
        </div>

        <div>
          <label for="cpf" class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
          <input
            type="text" id="cpf" name="cpf" required
            placeholder="000.000.000-00"
            maxlength="14"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-gray-50 transition-colors"
          >
        </div>
      </div>

      <div class="mt-5 space-y-3">
        <label class="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" name="terms_accepted" value="1" required class="mt-0.5 rounded accent-primary">
          <span class="text-xs text-gray-600">
            Li e aceito os <a href="{{ privacy_url }}" target="_blank" class="text-primary underline">Termos de Uso e Pol&iacute;tica de Privacidade</a> (vers&atilde;o {{ terms_version }}).
          </span>
        </label>
        <label class="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" name="marketing_optin" value="1" class="mt-0.5 rounded accent-primary">
          <span class="text-xs text-gray-600">Aceito receber comunica&ccedil;&otilde;es e promo&ccedil;&otilde;es por e-mail (opcional).</span>
        </label>
      </div>

      <button
        type="submit"
        class="mt-6 w-full bg-primary hover:bg-primary-hover text-white font-semibold py-3 rounded-xl transition-colors text-sm"
      >
        Cadastrar e conectar &rarr;
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const cpfInput = document.getElementById('cpf');
  cpfInput.addEventListener('input', () => {
    let v = cpfInput.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    if (v.length > 9) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
    else if (v.length > 6) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
    else if (v.length > 3) v = `${v.slice(0,3)}.${v.slice(3)}`;
    cpfInput.value = v;
  });
</script>
{% endblock %}

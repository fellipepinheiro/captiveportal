{% extends 'base.html' %}
{% block title %}Acesso Liberado!{% endblock %}

{% block content %}
<div class="w-full max-w-md fade-in">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-green-500 mb-4">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" class="w-8 h-8">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Acesso liberado!</h1>
    <p class="text-sm text-gray-500 mt-1">Bem-vindo(a), <strong>{{ name }}</strong>!</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center">
    <p class="text-sm text-gray-600 mb-6">
      Voc&ecirc; est&aacute; conectado &agrave; internet. Aproveite!
    </p>
    <a
      href="{{ redirect_url or 'http://google.com' }}"
      class="inline-block bg-primary hover:bg-primary-hover text-white font-semibold px-8 py-3 rounded-xl transition-colors text-sm"
    >
      Ir para a internet &rarr;
    </a>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  // Auto-redirect after 5 seconds
  const dest = "{{ redirect_url or 'http://google.com' }}";
  setTimeout(() => { window.location.href = dest; }, 5000);
</script>
{% endblock %}

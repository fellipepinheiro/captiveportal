{% extends 'portal/base.html' %}

{% block steps %}
<div class="mb-6 flex items-center justify-center">
  <div class="step-dot active">1</div>
  <div class="step-line"></div>
  <div class="step-dot pending">2</div>
  <div class="step-line"></div>
  <div class="step-dot pending">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
</div>
<p class="mb-6 text-center text-xs text-slate-500 -mt-3">Identificação</p>
{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('portal.identify') }}" class="space-y-4" id="form-identify" novalidate>

  <div>
    <label for="email" class="mb-1.5 block text-sm font-medium text-slate-300">
      E-mail
    </label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center">
        <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </span>
      <input id="email" name="email" type="email" required autocomplete="email"
             class="input-field pl-10"
             placeholder="voce@exemplo.com"
             value="{{ request.form.get('email', '') }}">
    </div>
    <p class="mt-1 hidden text-xs text-rose-400" id="email-error">Informe um e-mail válido.</p>
  </div>

  <div>
    <label for="mobile" class="mb-1.5 block text-sm font-medium text-slate-300">
      Celular / WhatsApp
    </label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center">
        <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="14" height="20" x="5" y="2" rx="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </span>
      <input id="mobile" name="mobile" type="tel" required autocomplete="tel"
             class="input-field pl-10"
             placeholder="(47) 99999-9999"
             maxlength="15"
             value="{{ request.form.get('mobile', '') }}">
    </div>
    <p class="mt-1 hidden text-xs text-rose-400" id="mobile-error">Informe um celular válido com DDD.</p>
  </div>

  <div class="flex items-center gap-2.5 rounded-xl border border-white/8 bg-white/4 px-3.5 py-2.5">
    <svg class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z"/>
    </svg>
    <span class="text-xs text-slate-400">Rede: <strong class="text-slate-200">{{ ssid or 'Visitantes' }}</strong></span>
  </div>

  <div class="pt-1">
    <button type="submit" class="btn-primary" id="btn-submit">
      Continuar
    </button>
  </div>

  <p class="text-center text-xs text-slate-600">
    Primeira vez? Você será cadastrado rapidamente.
  </p>
</form>

<script>
  // Máscara de telefone
  const mobileInput = document.getElementById('mobile');
  mobileInput.addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    if (v.length >= 7) {
      v = v.length === 11
        ? `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`
        : `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;
    } else if (v.length >= 3) {
      v = `(${v.slice(0,2)}) ${v.slice(2)}`;
    } else if (v.length >= 1) {
      v = `(${v}`;
    }
    this.value = v;
  });

  // Validação antes de submeter
  document.getElementById('form-identify').addEventListener('submit', function(e) {
    let valid = true;
    const email = document.getElementById('email');
    const mobile = document.getElementById('mobile');
    const emailErr = document.getElementById('email-error');
    const mobileErr = document.getElementById('mobile-error');

    if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
      email.classList.add('error');
      emailErr.classList.remove('hidden');
      valid = false;
    } else {
      email.classList.remove('error');
      emailErr.classList.add('hidden');
    }

    const digits = mobile.value.replace(/\D/g, '');
    if (digits.length < 10 || digits.length > 11) {
      mobile.classList.add('error');
      mobileErr.classList.remove('hidden');
      valid = false;
    } else {
      mobile.classList.remove('error');
      mobileErr.classList.add('hidden');
    }

    if (!valid) { e.preventDefault(); return; }
    document.getElementById('btn-submit').disabled = true;
    document.getElementById('btn-submit').textContent = 'Verificando...';
  });
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin &mdash; Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Inter','Segoe UI',sans-serif;}</style>
</head>
<body class="min-h-full bg-gray-50 flex items-center justify-center p-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm w-full">
        {% for category, message in messages %}
          <div class="rounded-xl px-4 py-3 shadow text-sm
            {% if category == 'error' %}bg-red-50 border border-red-200 text-red-800
            {% else %}bg-green-50 border border-green-200 text-green-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-6 text-center">Administra&ccedil;&atilde;o</h1>
    <form method="POST" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usu&aacute;rio</label>
          <input type="text" id="username" name="username" required autocomplete="username"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-gray-50">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" id="password" name="password" required
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-gray-50">
        </div>
      </div>
      <button type="submit"
        class="mt-6 w-full bg-[#01696f] hover:bg-[#0c4e54] text-white font-semibold py-3 rounded-xl transition-colors text-sm">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>

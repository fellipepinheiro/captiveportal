{% extends 'admin/base.html' %}
{% block full_content %}
<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <div class="mb-8 text-center">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-teal-600/20 mb-4">
        <svg class="h-7 w-7 text-teal-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-white">Painel Admin</h1>
      <p class="text-sm text-slate-400 mt-1">Portal Wi-Fi UniFi</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 rounded-xl px-4 py-3 text-sm bg-rose-500/10 border border-rose-400/20 text-rose-200">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="bg-slate-900 border border-white/10 rounded-2xl p-8 shadow-2xl space-y-5">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Usuário</label>
        <input type="text" name="username" value="{{ username or '' }}" required autofocus
               class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-2.5 text-sm text-slate-100
                      placeholder-slate-500 focus:outline-none focus:border-teal-500/50 focus:bg-white/8 transition">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Senha</label>
        <input type="password" name="password" required
               class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-2.5 text-sm text-slate-100
                      placeholder-slate-500 focus:outline-none focus:border-teal-500/50 transition">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-teal-600 hover:bg-teal-500 py-2.5 text-sm font-semibold text-white transition active:scale-95">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}

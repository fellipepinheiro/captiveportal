{% extends 'admin/base.html' %}
{% block content %}
<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center h-12 w-12 rounded-2xl bg-teal-600/20 mb-4">
        <svg class="h-6 w-6 text-teal-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-slate-100">Portal Wi-Fi</h1>
      <p class="text-sm text-slate-400 mt-1">Acesso ao painel administrativo</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="mb-4 rounded-xl px-4 py-3 text-sm
            {% if cat == 'error' %}bg-rose-500/10 border border-rose-400/20 text-rose-200
            {% else %}bg-teal-500/10 border border-teal-400/20 text-teal-200{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('admin.login_post') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Usuário</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-2.5 text-sm text-slate-100
                      focus:outline-none focus:border-teal-500/50 transition">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Senha</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-2.5 text-sm text-slate-100
                      focus:outline-none focus:border-teal-500/50 transition">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-teal-600 hover:bg-teal-500 py-2.5 text-sm font-semibold text-white transition">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% extends 'admin/base.html' %}
{% block title %}UniFi{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold mb-6">Configurações UniFi</h2>

<div class="max-w-xl space-y-6">
  <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
    <form method="post" action="{{ url_for('admin.unifi_save') }}" class="space-y-4" id="unifi-form">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">URL do Controlador UniFi</label>
        <input name="base_url" type="url" value="{{ base_url }}"
               placeholder="https://192.168.1.1"
               class="w-full rounded-xl bg-white/10 border border-white/20 px-4 py-2.5 text-sm
                      focus:outline-none focus:border-teal-400">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">API Key</label>
        <input name="api_key" type="password" value="{{ api_key }}"
               placeholder="••••••••••••"
               class="w-full rounded-xl bg-white/10 border border-white/20 px-4 py-2.5 text-sm
                      focus:outline-none focus:border-teal-400">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Site ID</label>
        <input name="site_id" type="text" value="{{ site_id }}"
               placeholder="default"
               class="w-full rounded-xl bg-white/10 border border-white/20 px-4 py-2.5 text-sm
                      focus:outline-none focus:border-teal-400">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Tempo de sessão (minutos)</label>
        <input name="auth_minutes" type="number" min="1" max="99999" value="{{ auth_minutes }}"
               class="w-full rounded-xl bg-white/10 border border-white/20 px-4 py-2.5 text-sm
                      focus:outline-none focus:border-teal-400">
      </div>
      <div class="flex items-center gap-3">
        <input name="allow_revisit" type="checkbox" id="allow_revisit"
               {% if allow_revisit == 'true' %}checked{% endif %}
               class="h-4 w-4 rounded accent-teal-500">
        <label for="allow_revisit" class="text-sm text-slate-300">Reautorizar visitante recorrente automaticamente</label>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="flex-1 rounded-xl bg-teal-600 py-2.5 text-sm font-semibold hover:bg-teal-500 transition">Salvar</button>
        <button type="button" id="test-btn"
                class="rounded-xl border border-white/20 bg-white/5 px-5 py-2.5 text-sm hover:bg-white/10 transition">
          Testar conexão
        </button>
      </div>
    </form>
  </div>

  <div id="test-result" class="hidden rounded-2xl border px-5 py-4 text-sm"></div>
</div>

<script>
document.getElementById('test-btn').addEventListener('click', async () => {
  const form = document.getElementById('unifi-form');
  const res  = document.getElementById('test-result');
  res.className = 'rounded-2xl border px-5 py-4 text-sm';
  res.textContent = 'Testando…';
  res.classList.remove('hidden');
  try {
    const r = await fetch('{{ url_for("admin.unifi_test") }}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        base_url: form.base_url.value,
        api_key:  form.api_key.value,
      })
    });
    const data = await r.json();
    if (data.ok) {
      res.classList.add('border-teal-400/30', 'bg-teal-500/10', 'text-teal-100');
      const names = (data.sites||[]).map(s=>s.name||s.id).join(', ');
      res.textContent = '✓ Conexão OK' + (names ? ` — sites: ${names}` : '');
    } else {
      res.classList.add('border-rose-400/30', 'bg-rose-500/10', 'text-rose-200');
      res.textContent = '✗ Erro: ' + (data.error || 'Falha desconhecida');
    }
  } catch(e) {
    res.classList.add('border-rose-400/30', 'bg-rose-500/10', 'text-rose-200');
    res.textContent = '✗ Erro de rede: ' + e.message;
  }
});
</script>
{% endblock %}
